<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vape Temp Finder</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #ffffff;
}
 
.widget {
  max-width: 600px;
  margin: 0 auto;
  padding: 28px 24px 32px;
  box-sizing: border-box;
}
 
.widget-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #1B3A2F;
  margin-bottom: 6px;
}
 
.widget-heading {
  font-size: 22px;
  font-weight: 700;
  color: #1B3A2F;
  margin: 0 0 6px;
  line-height: 1.25;
}
 
.widget-sub {
  font-size: 14px;
  color: #5a6a62;
  margin: 0 0 22px;
}
 
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
 
.option-btn {
  background: #f4f1ec;
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 14px 12px;
  cursor: pointer;
  text-align: left;
  transition: all 0.18s ease;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
 
.option-btn:hover {
  background: #e8f0ec;
  border-color: #1B3A2F;
}
 
.option-btn.selected {
  background: #1B3A2F;
  border-color: #1B3A2F;
}
 
.option-btn.selected .option-emoji,
.option-btn.selected .option-title,
.option-btn.selected .option-desc {
  color: #ffffff;
}
 
.option-emoji {
  font-size: 22px;
  display: block;
  margin-bottom: 6px;
}
 
.option-title {
  font-size: 13px;
  font-weight: 700;
  color: #1B3A2F;
  display: block;
  margin-bottom: 2px;
}
 
.option-desc {
  font-size: 12px;
  color: #5a6a62;
  line-height: 1.4;
}
 
.option-btn.selected .option-desc {
  color: #b8d4c4;
}
 
.result {
  background: #1B3A2F;
  border-radius: 12px;
  padding: 20px 22px;
  display: none;
  animation: fadeUp 0.22s ease;
}
 
.result.visible {
  display: block;
}
 
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
 
.result-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #7fad94;
  margin-bottom: 4px;
}
 
.result-temp {
  font-size: 32px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 4px;
  line-height: 1.1;
}
 
.result-name {
  font-size: 14px;
  font-weight: 600;
  color: #b8d4c4;
  margin-bottom: 10px;
}
 
.result-text {
  font-size: 13px;
  color: #d4e8dc;
  line-height: 1.6;
  margin-bottom: 14px;
}
 
.result-tip {
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #b8d4c4;
  line-height: 1.5;
}
 
.result-tip strong {
  color: #ffffff;
}
 
.reset-btn {
  margin-top: 14px;
  background: transparent;
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 8px;
  color: #b8d4c4;
  font-size: 12px;
  padding: 7px 14px;
  cursor: pointer;
  transition: all 0.15s ease;
}
 
.reset-btn:hover {
  background: rgba(255,255,255,0.08);
  color: #ffffff;
}
</style>
</head>
<body>
 
<div class="widget">
  <p class="widget-label">Quick Guide</p>
  <p class="widget-heading">What kind of session are you after?</p>
  <p class="widget-sub">Tap a vibe to get your ideal temperature range.</p>
 
  <div class="options">
    <button class="option-btn" onclick="selectOption(this, 'flavor')" aria-label="Flavor and clarity session">
      <span class="option-emoji">🍋</span>
      <span class="option-title">Flavor first</span>
      <span class="option-desc">I want to taste the terpenes clearly</span>
    </button>
    <button class="option-btn" onclick="selectOption(this, 'balanced')" aria-label="Balanced session">
      <span class="option-emoji">🌿</span>
      <span class="option-title">Balanced session</span>
      <span class="option-desc">Something in the middle, smooth and steady</span>
    </button>
    <button class="option-btn" onclick="selectOption(this, 'full')" aria-label="Full extraction session">
      <span class="option-emoji">🔥</span>
      <span class="option-title">Full extraction</span>
      <span class="option-desc">I want to get everything out of the bowl</span>
    </button>
    <button class="option-btn" onclick="selectOption(this, 'step')" aria-label="Step through temperatures">
      <span class="option-emoji">🎯</span>
      <span class="option-title">The full journey</span>
      <span class="option-desc">Step through temps for the complete experience</span>
    </button>
  </div>
 
  <div class="result" id="result">
    <p class="result-label">Your temperature</p>
    <p class="result-temp" id="result-temp"></p>
    <p class="result-name" id="result-name"></p>
    <p class="result-text" id="result-text"></p>
    <p class="result-tip" id="result-tip"></p>
    <button class="reset-btn" onclick="resetWidget()">Try another &rarr;</button>
  </div>
</div>
 
<script>
var data = {
  flavor: {
    temp: "175–185°C",
    name: "The Terpene Zone",
    text: "This is where terpenes shine. You'll get the clearest flavor expression from your flower, with a lighter, more uplifting character. Vapor production is thinner here, which is normal.",
    tip: "<strong>Pro tip:</strong> Take slow 6–8 second draws and let the oven settle for 10 seconds between hits. This range rewards patience."
  },
  balanced: {
    temp: "190–200°C",
    name: "The Sweet Spot",
    text: "Most cannabinoids vaporize in this range alongside the remaining terpenes. You get a fuller experience without pushing into high-heat territory. A great everyday setting.",
    tip: "<strong>Pro tip:</strong> Stir your bowl halfway through to redistribute the material and keep extraction even."
  },
  full: {
    temp: "205–215°C",
    name: "Full Extraction",
    text: "This range finishes off the bowl completely. Vapor will be denser and the taste turns more toasty. Your material should come out evenly brown with no green spots.",
    tip: "<strong>Pro tip:</strong> Don't start here. Use this as your final step after running through the lower ranges first."
  },
  step: {
    temp: "175° → 195° → 210°C",
    name: "The Step Ramp",
    text: "Start at 175°C for flavor, step to 195°C when vapor thins, then finish at 210°C to fully extract the bowl. This technique gets the most out of your flower across a single session.",
    tip: "<strong>Pro tip:</strong> Take 3–4 hits at each stage before stepping up. The whole session usually runs 10–15 draws total."
  }
};
 
function selectOption(btn, key) {
  var btns = document.querySelectorAll('.option-btn');
  btns.forEach(function(b) { b.classList.remove('selected'); });
  btn.classList.add('selected');
 
  var d = data[key];
  document.getElementById('result-temp').textContent = d.temp;
  document.getElementById('result-name').textContent = d.name;
  document.getElementById('result-text').textContent = d.text;
  document.getElementById('result-tip').innerHTML = d.tip;
 
  var result = document.getElementById('result');
  result.classList.remove('visible');
  void result.offsetWidth;
  result.classList.add('visible');
}
 
function resetWidget() {
  var btns = document.querySelectorAll('.option-btn');
  btns.forEach(function(b) { b.classList.remove('selected'); });
  var result = document.getElementById('result');
  result.classList.remove('visible');
}
</script>
 
</body>
</html>
